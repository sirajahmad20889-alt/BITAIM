name: Build Standalone Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Gradle wrapper JAR
        run: |
          curl -fL "https://services.gradle.org/distributions/gradle-8.0.1-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle_dist
          /tmp/gradle_dist/gradle-8.0.1/bin/gradle wrapper --gradle-version 8.0.1 --project-dir android

      - name: Write Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;33.0.0" \
            "ndk;23.1.7779620" 2>&1 | tail -10

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # assembleRelease runs React Native's bundleReleaseJsAndAssets task.
      # Unlike a normal debug build, this packages index.android.bundle in the APK.
      - name: Build standalone release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: BitAim-v3.1-standalone-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
